name: Radar de tiendas
on:
  schedule:
    - cron: "0 11 * * *"   # 6:00 a. m. en Bogota, todos los dias
  workflow_dispatch: {}     # boton "Run workflow" para correrlo a mano
permissions:
  contents: write
jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python radar-dropshippers/radar/radar.py
      - name: Guardar resultados
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add radar-dropshippers/data
          git diff --cached --quiet || git commit -m "Radar $(date -u +%F)"
          git push
